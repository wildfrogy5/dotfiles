conky.config = {
    alignment = 'top_right',
    background = false,
    border_width = 0,
    cpu_avg_samples = 2,
    default_color = 'd5d9e0',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = false,
    draw_outline = false,
    draw_shades = false,
    gap_x = 30,
    gap_y = 40,
    minimum_width = 250,
    maximum_width = 300,
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    update_interval = 1,
    use_xft = true,
    font = 'monospace:size=10',
};

conky.text = [[
${color 819bb5}SYSTEM STATUS${color}
${color 666d79}────────────────────────${color}

HOST       ${alignr}${nodename}
UPTIME     ${alignr}${uptime}

${color 819bb5}PROCESSOR${color}
CPU LOAD   ${alignr}${cpu cpu0}%
${cpubar cpu0 6,250}

${color 819bb5}MEMORY${color}
RAM        ${alignr}${mem} / ${memmax}
${membar 6,250}

${color 819bb5}STORAGE${color}
ROOT       ${alignr}${fs_used /} / ${fs_size /}
${fs_bar 6,250 /}

${color 819bb5}NETWORK${color}
DOWN       ${alignr}${downspeed}
UP         ${alignr}${upspeed}

${color 666d79}UPDATED ${alignr}${time %H:%M:%S}${color}
]];
