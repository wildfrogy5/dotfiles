# Graphite Dusk — rounded, opaque XFCE windows

backend = "glx";
vsync = true;

corner-radius = 16;
rounded-corners-exclude = [
    "window_type = 'desktop'"
];

shadow = true;
shadow-radius = 16;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.35;

active-opacity = 1.0;
inactive-opacity = 1.0;
frame-opacity = 1.0;

fading = false;

shadow-exclude = [
    "window_type = 'desktop'"
];
